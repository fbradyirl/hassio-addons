name: StreamMaster
version: "1.0"
slug: streammaster
description: "Custom addon to run StreamMaster"
startup: services
image: local/streammaster
ports:
  7095/tcp: 7095
map:
  - type: homeassistant_config
    read_only: false
    path: /config
arch:
  - aarch64
  - amd64
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
